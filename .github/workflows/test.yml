name: Tests

# 輕量測試關卡：只跑測試，不下載資料、不建置、不 commit。
# 資料建置 workflow 只在排程／手動時執行，PR（含 Dependabot 升級）需要自己的驗證關卡。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # engine.js 純邏輯＋golden 交叉比對（與 Python ETL 同一份凍結快照）
      - name: Run engine tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # DOM／viewport／競態（C1、C3–C8、E3–E6），以 route mock 注入失敗
      - name: Run e2e tests
        run: npm run e2e
