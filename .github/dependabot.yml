version: 2
updates:
  # workflow 內的 actions 皆 pin commit SHA，升級一律經 PR 審查
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  # 僅前端測試用（@playwright/test）；網站本身無 npm 依賴
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
